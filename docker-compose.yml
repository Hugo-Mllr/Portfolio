# Stack compatible Portainer (Stacks > Add stack > Repository ou Web editor).
# Les variables se saisissent dans Portainer (jamais dans le dépôt) : voir .env.example
services:
  web:
    # Image publiée par GitHub Actions. Pour builder sur le serveur à la place, voir docs/DEPLOY.md.
    image: ${IMAGE:-ghcr.io/hugo-mllr/portfolio:latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Port lié à localhost uniquement : le trafic public passe par le tunnel Cloudflare,
    # jamais directement par l'IP du serveur.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks: [web]

  cloudflared:
    # Version épinglée ; mettre à jour volontairement (CLOUDFLARED_VERSION).
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.11.0}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}   # secret : à saisir dans Portainer uniquement
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [web]
    networks: [web]

networks:
  web:
