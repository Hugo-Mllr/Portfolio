# Stack Portainer (Stacks > Add stack > Repository) : le site, CONSTRUIT SUR LE SERVEUR depuis ce dépôt.
# Aucun registre d'images, donc aucun jeton. Le site rejoint le réseau Docker d'un tunnel Cloudflare
# (cloudflared) DÉJÀ en service : aucun second cloudflared.
# Variables (à saisir dans Portainer, jamais dans le dépôt) : voir .env.example
services:
  # Le nom du service devient un alias DNS sur le réseau partagé : il doit être unique.
  portfolio-web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://example.com}   # liens canoniques / sitemap / Open Graph
    # `build` : l'image est toujours reconstruite au déploiement ET jamais "tirée" d'un registre
    # (sans cela, l'étape pull de Portainer échoue : il n'y a pas d'image à télécharger).
    pull_policy: build
    # Nom stable et unique, résolu par cloudflared : route Cloudflare -> http://portfolio-web:8080
    container_name: portfolio-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Lié à localhost seulement : jamais exposé directement sur Internet.
    # (Si ton cloudflared tourne directement sur l'hôte, la route peut viser http://localhost:8080.)
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks: [tunnel]

networks:
  tunnel:
    # Réseau Docker EXISTANT dans lequel tourne ton conteneur cloudflared.
    external: true
    name: ${TUNNEL_NETWORK:?définir TUNNEL_NETWORK (nom du réseau de ton cloudflared)}
