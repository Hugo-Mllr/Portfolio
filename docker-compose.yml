# Stack Portainer : le site seul. Il rejoint le réseau Docker d'un tunnel Cloudflare (cloudflared)
# DÉJÀ en service chez toi : aucun second cloudflared, donc aucun jeton dans cette stack.
# Variables (à saisir dans Portainer, jamais dans le dépôt) : voir .env.example
services:
  # Le nom du service devient un alias DNS sur le réseau partagé : il doit être unique
  # (un service "web" entrerait en collision avec ceux des autres stacks).
  portfolio-web:
    image: ${IMAGE:-ghcr.io/hugo-mllr/portfolio:latest}
    # Nom stable et unique, résolu par cloudflared : route Cloudflare -> http://portfolio-web:8080
    container_name: portfolio-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Lié à localhost seulement : jamais exposé directement sur Internet.
    # (Si ton cloudflared tourne directement sur l'hôte, la route peut viser http://localhost:8080.)
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks: [tunnel]

networks:
  tunnel:
    # Réseau Docker EXISTANT dans lequel tourne ton conteneur cloudflared.
    external: true
    name: ${TUNNEL_NETWORK:?définir TUNNEL_NETWORK (nom du réseau de ton cloudflared)}
