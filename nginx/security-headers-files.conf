# En-têtes pour /files/ (CV PDF, pièces jointes) : mêmes protections que le reste SAUF la CSP.
# Une CSP `object-src 'none'` empêche la visionneuse PDF du navigateur d'afficher le fichier.
# Ces fichiers sont déposés uniquement par le propriétaire du site.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
