server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml;
  gzip_min_length 512;

  # Site statique : seules les lectures sont autorisées
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  # Assets Astro versionnés par hash : cache long
  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Pièces jointes déposées par l'utilisateur
  location /files/ {
    include /etc/nginx/snippets/security-headers-files.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
