name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Contrôle anti-secrets
        run: bash scripts/check-secrets.sh
      - run: npm ci
      - run: npm run build
      - name: Build avec brouillons (valide aussi les contenus en cours)
        run: SHOW_DRAFTS=1 npm run build
